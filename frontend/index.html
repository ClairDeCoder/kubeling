<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kubeling</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!--
    Full-screen background video.
    - Paused at frame 0 (poster) during onboarding.
    - app.js calls .play() on spawn submit.
    - On 'ended', app.js hides it and transitions to game.
    Assets: frontend/assets/pod-launch.mp4, pod-launch-poster.jpg
  -->
  <video
    id="bg-video"
    preload="auto"
    muted
    playsinline
  >
    <source src="/static/assets/pod-launch.webm" type="video/webm" />
    <source src="/static/assets/pod-launch.mp4" type="video/mp4" />
  </video>

  <!-- ══ ONBOARDING ══ -->
  <section id="screen-onboarding" class="screen">
    <div class="onboard-header">
      <div class="title">KUBELING</div>
      <div class="subtitle">a pod is waiting for you...</div>
    </div>

    <form id="form-onboard" class="pixel-box" style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-row">
        <label for="input-name">KUBELING NAME</label>
        <input id="input-name" type="text" maxlength="32" placeholder="enter a name..." autocomplete="off" required />
      </div>
      <div class="form-row">
        <label>COLOR</label>
        <!-- Swatches built dynamically by app.js -->
        <div id="swatch-row" class="swatch-row"></div>
      </div>
      <button type="submit" class="btn">LAUNCH A POD</button>
    </form>

    <div class="social-links">
      <a href="https://github.com/ClairDeCoder/" target="_blank" rel="noopener" class="social-link">
        <div class="social-logo" id="logo-github">
          <img src="/static/assets/github_logo_bw.png" alt="GitHub" />
        </div>
        <span>GITHUB</span>
      </a>
      <a href="https://www.linkedin.com/in/brandon-sweat/" target="_blank" rel="noopener" class="social-link">
        <div class="social-logo" id="logo-linkedin">
          <img src="/static/assets/linkedin_logo_bw.png" alt="LinkedIn" />
        </div>
        <span>LINKEDIN</span>
      </a>
    </div>
  </section>

  <!-- ══ GAME ══ -->
  <section id="screen-game" class="screen">
    <div class="game-header">
      <span class="kubeling-name" id="game-name">—</span>
      <span id="game-status" style="font-size:7px;">ALIVE</span>
    </div>

    <!--
      Pod interior background.
      Set inline style background-image to assets/pod-interior.png once ready.
      e.g. style="background-image: url('assets/pod-interior.png')"
    -->
    <div class="kubeling-viewport" id="kubeling-viewport">
      <div id="kubeling-sprite" class="idle">
        <video id="sprite-main" muted playsinline loop style="display:none;"></video>
        <video id="sprite-action" muted playsinline style="display:none;"></video>
        <img id="sprite-img" src="" alt="" style="display:none;" />
        <div id="sprite-placeholder" class="sprite-placeholder">🐣</div>
      </div>
      <video id="sprite-video" muted playsinline style="display:none;"></video>
      <div class="zzz" id="zzz">z z z</div>
      <button class="feed-box" id="btn-feed" title="Feed your Kubeling">
        <img src="/static/assets/cookie_icon.png" alt="Feed" />
      </button>
      <button class="sleep-box" id="btn-sleep" title="Put your Kubeling to sleep">
        <img src="/static/assets/moon_icon.png" alt="Sleep" />
      </button>
      <div class="viewport-hint">click your kubeling to cheer it up</div>
    </div>

    <div class="stats pixel-box">
      <div class="stat-row">
        <div class="stat-label"><span>FULLNESS</span><span><span id="val-fullness">100</span>/100</span></div>
        <div class="bar-track"><div id="bar-fullness" class="bar-fill" style="width:100%"></div></div>
      </div>
      <div class="stat-row">
        <div class="stat-label"><span>MOOD</span><span><span id="val-mood">100</span>/100</span></div>
        <div class="bar-track"><div id="bar-mood" class="bar-fill" style="width:100%"></div></div>
      </div>
      <div class="stat-row">
        <div class="stat-label"><span>TIREDNESS</span><span><span id="val-tiredness">0</span>/100</span></div>
        <div class="bar-track"><div id="bar-tiredness" class="bar-fill tiredness" style="width:0%"></div></div>
      </div>
    </div>

    <button class="btn secondary small" onclick="window.location.href='/stats'">STATS WITH GRAFANA</button>
    <button class="btn secondary small" onclick="window.location.href='/arch'">AWS ARCH</button>
  </section>

  <!-- ══ DEATH ══ -->
  <section id="screen-death" class="screen">
    <div class="game-over">GAME OVER</div>
    <div class="death-name" id="death-name">—</div>
    <div class="death-cause" id="death-cause">—</div>

    <div class="death-stats pixel-box">
      <div class="death-stat-row">LIFESPAN      <span id="death-lifespan">—</span></div>
      <div class="death-stat-row">PEAK FULLNESS <span id="death-peak-fullness">—</span></div>
      <div class="death-stat-row">PEAK MOOD     <span id="death-peak-mood">—</span></div>
    </div>

    <button class="btn" id="btn-play-again">TRY AGAIN</button>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
